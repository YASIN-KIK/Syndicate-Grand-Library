services:
  - type: web
    name: syndicate-grand-library
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
